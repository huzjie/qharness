apiVersion: v1
kind: Service
metadata:
  name: {{ include "qharness.fullname" . }}
  labels:
    {{- include "qharness.name" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "qharness.fullname" . }}-brain
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
